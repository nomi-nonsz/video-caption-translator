name: Build

on:
  push:
    tags:
      - 'v*.*.*'

env:
  APP_NAME: video-caption-translator
  REGISTRY: ghcr.io

jobs:
  build-unixes:
    name: Build unixes (Linux/MacOS) release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Build unixes
        run: |
          make install
          make build
          rm -f dist\*.map
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unixes
          path: dist/
  
  build-windows:
    name: Build windows release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Build windows
        shell: pwsh
        run: |
          bun install
          bun run build-windows
          Remove-Item -Path "dist\*.map" -Force -ErrorAction SilentlyContinue
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: dist/${{ env.APP_NAME }}-windows.exe

  container:
    name: Build container release
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: nomi-nonsz
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/nomi-nonsz/${{ env.APP_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
        
      - name: Build
        uses: docker/build-push-action@v5
        if: github.ref_type == 'tag'
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create draft release
    needs: [build-unixes, build-windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloads

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./downloads/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: false